[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "brix"
version = "0.1.0"
description = "A build-system toolkit: define build graphs in ordinary Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Duane Knesek", email = "duane.knesek@gmail.com" }]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brix-workerd = "brix.workerd_cli:main"

[tool.maturin]
manifest-path = "rust/brix-py/Cargo.toml"
python-source = "src"
python-packages = ["brix"]
module-name = "brix.brix_py"
bindings = "pyo3"
strip = true
include = [
  { path = "src/brix/_java/*.java", format = ["sdist", "wheel"] },
  { path = "src/brix/_ts/*.py", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
