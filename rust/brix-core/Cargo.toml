[package]
name = "brix-core"
version = "0.1.0"
edition = "2021"
description = "The brix build engine core (pure Rust; no PyO3). Phase 1: patterns, data atoms, fingerprint digest, shlex."

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Jar reading for the jvm-abi content identity (jvmabi.rs). Deflate only —
# jars are plain zip archives; no encryption/zstd/etc.
zip = { version = "2", default-features = false, features = ["deflate"] }
fancy-regex = "0.19.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # SIGTERM for graceful worker teardown (workers.rs)
