[package]
name = "brix-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 boundary for the brix Rust engine: JSON spec/config in, JSON events + result out (docs/boundary-schema.md)."

[lib]
name = "brix_py"
crate-type = ["cdylib"]

[dependencies]
brix-core = { path = "../brix-core" }
brix-workerd = { path = "../brix-workerd" }
pyo3 = { version = "0.27", features = ["extension-module"] }
serde_json = "1"
